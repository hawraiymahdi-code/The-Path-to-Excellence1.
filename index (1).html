<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>درب التميّز</title>
<meta name="description" content="درب تراثي بين معالم البحرين للتدرّب على أسئلة الاختبارات الوطنية للصف الثاني عشر.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" dir="rtl" lang="ar"><div class="wrap">
  <header class="top">
    <div class="brand">
      <span id="logoFlag"></span>
      <div><b>درب التميّز</b><small>امتحانات الصف الثاني عشر الوطنية · مملكة البحرين</small></div>
    </div>
    <div class="tools">
      <span id="saveChip" class="chip" hidden></span>
      <button class="chip" id="musicBtn" aria-pressed="false" type="button">موسيقى هادئة</button>
      <button class="chip" id="sfxBtn" aria-pressed="true" type="button">المؤثرات الصوتية</button>
      <button class="chip" id="teacherBtn" type="button">دخول المعلمة</button>
      <button class="chip" id="homeBtn" type="button" hidden>الدرب</button>
    </div>
  </header>
  <main id="main"></main>
</div></div>
<canvas id="confetti" aria-hidden="true" hidden></canvas>
<div id="viewer" hidden>
  <div class="viewer-nav"><button class="btn small" id="vPrev" type="button">السابق</button><button class="btn small" id="vNext" type="button">التالي</button></div>
  <button class="btn primary small x" id="vClose" type="button">إغلاق</button>
  <div id="vBody"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/app.js" defer></script>
</body>
</html>
